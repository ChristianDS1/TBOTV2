<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T-BOT Monitor</title>
  <style>
    :root {
      --bg0: #0c1219;
      --bg1: #141c27;
      --line: #243042;
      --text: #e7eef7;
      --muted: #8fa3b8;
      --accent: #3ecf8e;
      --warn: #e6b35a;
      --bad: #e85d5d;
      --call: #3ecf8e;
      --put: #e85d5d;
      --font: "IBM Plex Sans", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a2a3a 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #152218 0%, transparent 50%),
        var(--bg0);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 1.25rem 1.5rem 0.75rem;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    header .meta { color: var(--muted); font-size: 0.85rem; font-family: var(--mono); }
    .session-banner {
      margin: 0.85rem 1.5rem 0;
      padding: 0.85rem 1.1rem;
      border: 1px solid #2a4a3a;
      background:
        linear-gradient(90deg, rgba(62, 207, 142, 0.12), rgba(20, 28, 39, 0.9) 55%);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      align-items: center;
    }
    .session-banner .sess-name {
      font-size: 1.25rem;
      font-family: var(--mono);
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .session-banner .sess-hours {
      font-family: var(--mono);
      color: var(--text);
      font-size: 0.95rem;
    }
    .session-banner .sess-meta {
      color: var(--muted);
      font-size: 0.8rem;
      font-family: var(--mono);
    }
    .session-banner .sess-pills {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .objective-blurb {
      padding: 0.35rem 1.5rem 0.15rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .session-banner .sess-pill {
      border: 1px solid var(--line);
      padding: 0.15rem 0.45rem;
      font-size: 0.7rem;
      font-family: var(--mono);
      color: var(--muted);
    }
    .session-banner .sess-pill.active {
      color: var(--accent);
      border-color: #2a6b4e;
      background: rgba(62, 207, 142, 0.08);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      padding: 1rem 1.5rem;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    .metric {
      background: linear-gradient(180deg, var(--bg1), #101821);
      border: 1px solid var(--line);
      padding: 0.9rem 1rem;
    }
    .metric .label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .metric .value { font-size: 1.35rem; font-family: var(--mono); margin-top: 0.25rem; }
    .pos { color: var(--accent); }
    .neg { color: var(--bad); }
    .charts-open {
      padding: 0 1.5rem 0.75rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 0.75rem;
    }
    .chart-panel {
      border: 1px solid var(--line);
      background: rgba(20, 28, 39, 0.9);
      padding: 0.55rem 0.65rem 0.35rem;
    }
    .chart-panel .cht-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.35rem;
      font-family: var(--mono);
      font-size: 0.78rem;
    }
    .chart-panel .cht-head .sym { color: var(--text); font-weight: 500; }
    .chart-panel .cht-head .meta { color: var(--muted); }
    .chart-el { height: 220px; width: 100%; }
    main {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 1rem;
      padding: 0 1.5rem 1.5rem;
    }
    @media (max-width: 1000px) {
      main { grid-template-columns: 1fr; }
    }
    section {
      background: rgba(20, 28, 39, 0.85);
      border: 1px solid var(--line);
      padding: 1rem;
      min-height: 220px;
    }
    section h2 {
      margin: 0 0 0.75rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 600;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-family: var(--mono); }
    th, td { text-align: left; padding: 0.35rem 0.4rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    .pill {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      font-size: 0.7rem;
      border: 1px solid var(--line);
    }
    .pill.call { color: var(--call); border-color: #2a6b4e; }
    .pill.put { color: var(--put); border-color: #6b2a2a; }
    button.chart-btn {
      background: transparent;
      border: 1px solid #2a6b4e;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      cursor: pointer;
    }
    button.chart-btn:hover { background: rgba(62, 207, 142, 0.1); }
    .status-bar {
      padding: 0.5rem 1.5rem 1rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.8rem;
    }
    .kill { color: var(--bad); font-weight: 600; }
    ul.insights { margin: 0; padding-left: 1.1rem; font-size: 0.82rem; color: #c5d2e0; }
    ul.insights li { margin-bottom: 0.35rem; }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 40;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      width: min(920px, 100%);
      background: #101821;
      border: 1px solid var(--line);
      padding: 0.85rem 1rem 1rem;
    }
    .modal .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
      font-family: var(--mono);
      font-size: 0.85rem;
    }
    .modal .modal-head button {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      cursor: pointer;
      font-family: var(--mono);
      padding: 0.2rem 0.5rem;
    }
    #modalChart { height: 360px; width: 100%; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header>
    <h1>T-BOT Adaptive Monitor</h1>
    <div class="meta" id="clock">—</div>
  </header>
  <div class="session-banner" id="sessionBanner">
    <div>
      <div class="label" style="color:var(--muted);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;">Operating session (UTC)</div>
      <div class="sess-name" id="sessName">—</div>
    </div>
    <div class="sess-hours" id="sessHours">—</div>
    <div class="sess-meta" id="sessMeta">—</div>
    <div class="sess-pills" id="sessPills"></div>
  </div>
  <div class="objective-blurb" id="objBlurb">ahora: aprender señales; después: aplicar ganadoras hacia +50%/día</div>
  <div class="grid" id="metrics"></div>
  <div class="charts-open" id="openCharts"></div>
  <main>
    <section>
      <h2>Open Trades</h2>
      <div id="open"></div>
    </section>
    <section>
      <h2>Recent Closed</h2>
      <div id="closed"></div>
    </section>
    <section>
      <h2>Rejected Signals</h2>
      <div id="rejected"></div>
    </section>
    <section>
      <h2>Learning / Rankings</h2>
      <div id="learning"></div>
    </section>
  </main>
  <div class="status-bar" id="status"></div>

  <div class="modal-backdrop" id="chartModal">
    <div class="modal">
      <div class="modal-head">
        <div id="modalTitle">Trade chart</div>
        <button type="button" id="modalClose">Close</button>
      </div>
      <div id="modalChart"></div>
    </div>
  </div>

  <script>
    const fmt = (n, d=2) => (n === null || n === undefined || Number.isNaN(n)) ? "—" : Number(n).toFixed(d);
    const pct = (n) => fmt(n * 100, 1) + "%";

    const openChartState = new Map(); // tradeId -> { chart, candle, mid, upper, lower, el }
    let modalChart = null;

    function metric(label, value, cls="") {
      return `<div class="metric"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`;
    }

    function sidePill(side) {
      const s = (side || "").toLowerCase();
      return `<span class="pill ${s}">${s.toUpperCase()}</span>`;
    }

    function chartTheme() {
      return {
        layout: { background: { color: "#101821" }, textColor: "#8fa3b8" },
        grid: { vertLines: { color: "#1c2836" }, horzLines: { color: "#1c2836" } },
        rightPriceScale: { borderColor: "#243042" },
        timeScale: { borderColor: "#243042", timeVisible: true, secondsVisible: false },
      };
    }

    function applySeriesData(state, data) {
      const candles = data.candles || [];
      if (!candles.length) return;
      state.candle.setData(candles);
      const mid = (data.bb || []).map(b => ({ time: b.time, value: b.mid }));
      const upper = (data.bb || []).map(b => ({ time: b.time, value: b.upper }));
      const lower = (data.bb || []).map(b => ({ time: b.time, value: b.lower }));
      state.mid.setData(mid);
      state.upper.setData(upper);
      state.lower.setData(lower);
      const marks = (data.markers || []).filter(m => !m.line).map(m => ({
        time: m.time,
        position: m.position || "belowBar",
        color: m.color || "#3ecf8e",
        shape: m.shape || "circle",
        text: m.text || "",
      }));
      state.candle.setMarkers(marks);
      // SL price lines
      if (state._slLines) {
        state._slLines.forEach(l => { try { state.candle.removePriceLine(l); } catch(e) {} });
      }
      state._slLines = [];
      (data.markers || []).filter(m => m.line && m.price != null).forEach(m => {
        const line = state.candle.createPriceLine({
          price: m.price,
          color: "#8fa3b8",
          lineWidth: 1,
          lineStyle: 2,
          axisLabelVisible: true,
          title: m.text || "SL",
        });
        state._slLines.push(line);
      });
      state.chart.timeScale().fitContent();
    }

    function ensureOpenChart(trade) {
      const id = String(trade.id);
      let st = openChartState.get(id);
      if (st) return st;
      const wrap = document.createElement("div");
      wrap.className = "chart-panel";
      wrap.dataset.tid = id;
      wrap.innerHTML = `<div class="cht-head"><span class="sym">${trade.symbol} ${sidePill(trade.side)}</span><span class="meta">#${trade.id} · live</span></div><div class="chart-el"></div>`;
      document.getElementById("openCharts").appendChild(wrap);
      const el = wrap.querySelector(".chart-el");
      const chart = LightweightCharts.createChart(el, { ...chartTheme(), height: 220, width: el.clientWidth || 400 });
      const candle = chart.addCandlestickSeries({
        upColor: "#3ecf8e", downColor: "#e85d5d",
        borderUpColor: "#3ecf8e", borderDownColor: "#e85d5d",
        wickUpColor: "#3ecf8e", wickDownColor: "#e85d5d",
      });
      const mid = chart.addLineSeries({ color: "#e6b35a", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
      const upper = chart.addLineSeries({ color: "#3a7ca5", lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
      const lower = chart.addLineSeries({ color: "#3a7ca5", lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
      st = { chart, candle, mid, upper, lower, wrap, el, symbol: trade.symbol, venue: trade.venue, tradeId: trade.id };
      openChartState.set(id, st);
      const ro = new ResizeObserver(() => {
        chart.applyOptions({ width: el.clientWidth });
      });
      ro.observe(el);
      st._ro = ro;
      return st;
    }

    function pruneOpenCharts(openIds) {
      const keep = new Set(openIds.map(String));
      for (const [id, st] of openChartState.entries()) {
        if (!keep.has(id)) {
          try { st._ro && st._ro.disconnect(); } catch(e) {}
          try { st.chart.remove(); } catch(e) {}
          if (st.wrap && st.wrap.parentNode) st.wrap.parentNode.removeChild(st.wrap);
          openChartState.delete(id);
        }
      }
    }

    async function refreshOpenCharts(opens) {
      pruneOpenCharts((opens || []).map(t => t.id).filter(Boolean));
      for (const t of (opens || [])) {
        if (!t.id) continue;
        const st = ensureOpenChart(t);
        try {
          const qs = new URLSearchParams({
            symbol: t.symbol,
            venue: t.venue || "crypto",
            limit: "120",
            trade_id: String(t.id),
          });
          const res = await fetch("/api/chart?" + qs);
          const data = await res.json();
          applySeriesData(st, data);
        } catch (e) {
          /* ignore chart fetch blips */
        }
      }
    }

    function openTradeModal(tradeId) {
      const backdrop = document.getElementById("chartModal");
      backdrop.classList.add("show");
      document.getElementById("modalTitle").textContent = `Trade #${tradeId}`;
      const el = document.getElementById("modalChart");
      if (modalChart) {
        try { modalChart.chart.remove(); } catch(e) {}
        modalChart = null;
      }
      el.innerHTML = "";
      const chart = LightweightCharts.createChart(el, { ...chartTheme(), height: 360, width: el.clientWidth || 800 });
      const candle = chart.addCandlestickSeries({
        upColor: "#3ecf8e", downColor: "#e85d5d",
        borderUpColor: "#3ecf8e", borderDownColor: "#e85d5d",
        wickUpColor: "#3ecf8e", wickDownColor: "#e85d5d",
      });
      const mid = chart.addLineSeries({ color: "#e6b35a", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
      const upper = chart.addLineSeries({ color: "#3a7ca5", lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
      const lower = chart.addLineSeries({ color: "#3a7ca5", lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
      modalChart = { chart, candle, mid, upper, lower, el };
      fetch("/api/chart/trade/" + tradeId)
        .then(r => r.json())
        .then(data => {
          document.getElementById("modalTitle").textContent =
            `Trade #${tradeId} · ${data.symbol || ""} · entry/exit`;
          applySeriesData(modalChart, data);
          chart.applyOptions({ width: el.clientWidth });
        })
        .catch(e => {
          document.getElementById("modalTitle").textContent = "Chart error: " + e;
        });
    }

    document.getElementById("modalClose").onclick = () => {
      document.getElementById("chartModal").classList.remove("show");
      if (modalChart) {
        try { modalChart.chart.remove(); } catch(e) {}
        modalChart = null;
      }
    };
    document.getElementById("chartModal").addEventListener("click", (ev) => {
      if (ev.target.id === "chartModal") document.getElementById("modalClose").click();
    });

    function renderTable(rows, cols) {
      if (!rows || !rows.length) return "<div style='color:var(--muted)'>None</div>";
      let h = "<table><thead><tr>" + cols.map(c => `<th>${c.label}</th>`).join("") + "</tr></thead><tbody>";
      for (const r of rows) {
        h += "<tr>" + cols.map(c => `<td>${c.render(r)}</td>`).join("") + "</tr>";
      }
      return h + "</tbody></table>";
    }

    async function refresh() {
      try {
        const res = await fetch("/api/monitor");
        const data = await res.json();
        const s = data.snapshot || {};
        const pnlCls = (s.realized_pnl || 0) >= 0 ? "pos" : "neg";
        const sess = data.session || (data.learning && data.learning.session) || {};
        document.getElementById("sessName").textContent = (sess.name || "—").toUpperCase();
        document.getElementById("sessHours").textContent = sess.hours || "—";
        document.getElementById("sessMeta").textContent =
          `now ${sess.utc_now || "—"} UTC · aware=${(data.learning||{}).session_aware !== false}`;
        const pills = (sess.buckets || []).map(b =>
          `<span class="sess-pill ${b.name === sess.name ? "active" : ""}">${b.name} ${b.hours}</span>`
        ).join("");
        document.getElementById("sessPills").innerHTML = pills || "";
        const obj = data.objective || (data.learning || {}).objective || {};
        const objEl = document.getElementById("objBlurb");
        if (objEl) objEl.textContent = obj.blurb || "ahora: aprender señales; después: aplicar ganadoras hacia +50%/día";
        const gainCls = (obj.day_gain_pct || 0) >= 0 ? "pos" : "neg";
        const gainLabel = obj.day_gain_pct == null
          ? "—"
          : `${fmt(obj.day_gain_pct, 1)}% / +${fmt(obj.daily_target_pct || 50, 0)}%`;

        document.getElementById("metrics").innerHTML = [
          metric("Equity", fmt(s.equity, 2) + " €"),
          metric("Cash", fmt(s.cash, 2) + " €"),
          metric("Hoy vs objetivo", gainLabel, gainCls),
          metric("Realized P&L", fmt(s.realized_pnl, 2), pnlCls),
          metric("Open", s.open_positions ?? 0),
          metric("Win Rate", pct(s.win_rate || 0)),
          metric("Expectancy", fmt(s.expectancy, 3)),
          metric("Profit Factor", fmt(s.profit_factor, 2)),
          metric("Drawdown", pct(s.drawdown || 0)),
          metric("Trades", s.total_trades ?? 0),
          metric("Explore Ratio", pct(s.exploration_ratio || 0)),
          metric("Phase", s.learning_phase || "—"),
          metric("Kill Switch", s.kill_switch ? "ON" : "OFF", s.kill_switch ? "neg" : "pos"),
        ].join("");

        document.getElementById("open").innerHTML = renderTable(data.open_trades, [
          { label: "Side", render: r => sidePill(r.side) },
          { label: "Symbol", render: r => r.symbol },
          { label: "Entry", render: r => fmt(r.entry_price, 5) },
          { label: "Size", render: r => fmt(r.qty, 2) },
          { label: "Conf", render: r => fmt(r.confidence, 1) },
          { label: "Venue", render: r => r.venue },
        ]);

        document.getElementById("closed").innerHTML = renderTable(data.closed_trades, [
          { label: "Side", render: r => sidePill(r.side) },
          { label: "Symbol", render: r => r.symbol },
          { label: "Entry", render: r => fmt(r.entry_price, 5) },
          { label: "Exit px", render: r => fmt(r.exit_price, 5) },
          { label: "PnL", render: r => `<span class="${(r.pnl||0)>=0?'pos':'neg'}">${fmt(r.pnl,3)}</span>` },
          { label: "Exit", render: r => r.exit_reason || "—" },
          { label: "Aprendizaje", render: r => {
              const lab = r.learning_label || (r.learning_direction === "win" ? "aprendizaje ganancia" : "aprendizaje perdida");
              const cls = (r.learning_direction === "win") ? "pos" : "neg";
              return `<span class="${cls}">${lab}</span>`;
            }
          },
          { label: "Chart", render: r => r.id
              ? `<button type="button" class="chart-btn" data-tid="${r.id}">View</button>`
              : "—" },
        ]);
        document.querySelectorAll("#closed .chart-btn").forEach(btn => {
          btn.onclick = () => openTradeModal(btn.dataset.tid);
        });

        document.getElementById("rejected").innerHTML = renderTable(data.rejected_signals, [
          { label: "Symbol", render: r => r.symbol },
          { label: "Reason", render: r => r.reason },
          { label: "Conf", render: r => fmt(r.confidence, 1) },
          { label: "Time", render: r => (r.timestamp || "").replace("T", " ").slice(0, 19) },
        ]);

        const ranks = (data.strategy_rankings || []).map(r =>
          `<li><b>${r.strategy}</b> exp=${fmt(r.expectancy,3)} pf=${fmt(r.profit_factor,2)} n=${r.trades} [${r.status}]</li>`
        ).join("") || "<li>No rankings yet</li>";
        const insights = (data.insights || []).slice(0, 8).map(i =>
          `<li>[${i.category}] ${i.content}</li>`
        ).join("") || "<li>No insights yet</li>";
        const fx = (s.venues && s.venues.forex) ? s.venues.forex : {};
        const cr = (s.venues && s.venues.crypto) ? s.venues.crypto : {};
        const pw = ((data.patterns || {}).wins || []).filter(p => p.status === "confirmed").slice(0, 5)
          .map(p => `<li>WIN ✓ ${p.pattern_key} n=${p.count}</li>`).join("") || "<li>No confirmed wins yet</li>";
        const pl = ((data.patterns || {}).losses || []).filter(p => p.status === "confirmed").slice(0, 5)
          .map(p => `<li>LOSS ✓ ${p.pattern_key} n=${p.count}</li>`).join("") || "<li>No confirmed losses yet</li>";
        document.getElementById("learning").innerHTML =
          `<ul class="insights">${ranks}</ul>
           <h2 style="margin-top:1rem">Confirmed patterns</h2>
           <ul class="insights">${pw}${pl}</ul>
           <h2 style="margin-top:1rem">Insights</h2>
           <ul class="insights">${insights}</ul>
           <h2 style="margin-top:1rem">Venues</h2>
           <ul class="insights">
             <li>Crypto ok=${cr.ok} ${cr.simulated ? "(simulated)" : ""}</li>
             <li>Forex session=${fx.forex_session_open ? "OPEN" : "CLOSED"} provider=${fx.provider || "—"}</li>
             <li>ML backend=${(data.model||{}).backend} brier=${fmt((data.model||{}).brier,4)}</li>
             <li>Capital resets=${data.capital_resets ?? 0}</li>
             <li>Session=${(data.learning||{}).current_session || "—"} (aware=${(data.learning||{}).session_aware})</li>
             <li>Daily report=${(data.daily_report||{}).day || "pending first rollover"}</li>
           </ul>`;

        const kill = data.kill_reason ? ` | <span class="kill">${data.kill_reason}</span>` : "";
        const dr = data.daily_report || {};
        const thr = (data.patterns && data.patterns.threshold) || 20;
        const sessName = sess.name || "—";
        document.getElementById("status").innerHTML =
          `status=${data.status} | mode=${data.mode} | cycle=${data.cycle} | session=${sessName} ${sess.hours || ""} | resets=${data.capital_resets ?? 0} | pattern≥${thr} | last_report=${dr.day || "—"} | refresh=5s${kill}`;
        document.getElementById("clock").textContent = new Date().toISOString().replace("T", " ").slice(0, 19) + " UTC";

        await refreshOpenCharts(data.open_trades || []);
      } catch (e) {
        document.getElementById("status").textContent = "monitor fetch failed: " + e;
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
