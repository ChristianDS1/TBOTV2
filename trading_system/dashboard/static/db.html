<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T-BOT DB Browser</title>
  <style>
    :root {
      --bg0: #0c1219;
      --bg1: #141c27;
      --line: #243042;
      --text: #e7eef7;
      --muted: #8fa3b8;
      --accent: #3ecf8e;
      --font: "IBM Plex Sans", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a2a3a 0%, transparent 55%),
        var(--bg0);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 1.25rem 1.5rem 0.75rem;
      border-bottom: 1px solid var(--line);
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: 0.04em; }
    header a { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-family: var(--mono); }
    .layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 70px); }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
    aside {
      border-right: 1px solid var(--line);
      padding: 1rem;
      background: rgba(20, 28, 39, 0.55);
    }
    aside h2 {
      margin: 0 0 0.75rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }
    .tbl-btn {
      display: flex;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      padding: 0.45rem 0.55rem;
      margin-bottom: 0.25rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tbl-btn:hover { border-color: var(--line); background: rgba(62, 207, 142, 0.06); }
    .tbl-btn.active { border-color: #2a6b4e; color: var(--accent); background: rgba(62, 207, 142, 0.1); }
    .tbl-btn .n { color: var(--muted); }
    main { padding: 1rem 1.25rem 2rem; overflow: auto; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 0.85rem;
    }
    .toolbar label { color: var(--muted); font-size: 0.75rem; font-family: var(--mono); }
    .toolbar select, .toolbar input, .toolbar button {
      background: var(--bg1);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 0.35rem 0.55rem;
      font-family: var(--mono);
      font-size: 0.8rem;
    }
    .toolbar button { cursor: pointer; color: var(--accent); border-color: #2a6b4e; }
    .meta { color: var(--muted); font-family: var(--mono); font-size: 0.78rem; margin-bottom: 0.5rem; }
    .wrap { overflow: auto; border: 1px solid var(--line); max-height: calc(100vh - 180px); }
    table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 0.78rem; font-family: var(--mono); }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 0.4rem 0.55rem;
      text-align: left;
      vertical-align: top;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    th { position: sticky; top: 0; background: #121a24; color: var(--muted); font-weight: 500; cursor: pointer; z-index: 1; }
    th:hover { color: var(--accent); }
    tr:hover td { background: rgba(62, 207, 142, 0.05); }
    td.expand { white-space: pre-wrap; max-width: 640px; word-break: break-word; }
    .empty { color: var(--muted); padding: 2rem; }
    .hint {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .hint code { color: var(--accent); font-family: var(--mono); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>T-BOT DB Browser</h1>
    <a href="/">← Monitor</a>
  </header>
  <div class="layout">
    <aside>
      <h2>Tables</h2>
      <div id="tables"></div>
    </aside>
    <main>
      <div class="toolbar">
        <label>limit <input id="limit" type="number" value="100" min="1" max="500" style="width:4.5rem" /></label>
        <label>offset <input id="offset" type="number" value="0" min="0" style="width:4.5rem" /></label>
        <button type="button" id="prev">Prev</button>
        <button type="button" id="next">Next</button>
        <button type="button" id="reload">Reload</button>
      </div>
      <div class="meta" id="meta">Select a table</div>
      <div class="wrap" id="grid"><div class="empty">No data</div></div>
      <div class="hint">
        Also open <code>data/trading.db</code> in Cursor with the SQLite Viewer extension
        (<code>qwtel.sqlite-viewer</code> (recommended in <code>.vscode/extensions.json</code>).
      </div>
    </main>
  </div>
  <script>
    let table = null;
    let orderBy = null;
    let orderDir = "DESC";
    let columns = [];

    async function loadTables() {
      const res = await fetch("/api/db/tables");
      const data = await res.json();
      const el = document.getElementById("tables");
      el.innerHTML = (data.tables || []).map(t =>
        `<button type="button" class="tbl-btn" data-t="${t.name}">
          <span>${t.name}</span><span class="n">${t.rows}</span>
        </button>`
      ).join("");
      el.querySelectorAll(".tbl-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          table = btn.dataset.t;
          orderBy = null;
          orderDir = "DESC";
          document.getElementById("offset").value = "0";
          loadRows();
          el.querySelectorAll(".tbl-btn").forEach(b => b.classList.toggle("active", b === btn));
        });
      });
      if (data.tables && data.tables.length) {
        const first = el.querySelector(".tbl-btn");
        if (first) first.click();
      }
    }

    async function loadRows() {
      if (!table) return;
      const limit = document.getElementById("limit").value || 100;
      const offset = document.getElementById("offset").value || 0;
      const qs = new URLSearchParams({
        limit, offset,
        order_dir: orderDir,
      });
      if (orderBy) qs.set("order_by", orderBy);
      const res = await fetch(`/api/db/table/${encodeURIComponent(table)}?` + qs);
      if (!res.ok) {
        document.getElementById("meta").textContent = "Error loading table";
        return;
      }
      const data = await res.json();
      columns = data.columns || [];
      if (!orderBy) orderBy = data.order_by;
      orderDir = data.order_dir || "DESC";
      document.getElementById("meta").textContent =
        `${data.table} · ${data.rows.length} shown · total ${data.total} · order ${orderBy} ${orderDir}`;
      if (!data.rows.length) {
        document.getElementById("grid").innerHTML = "<div class='empty'>Empty</div>";
        return;
      }
      let h = "<table><thead><tr>" + columns.map(c =>
        `<th data-c="${c}">${c}${c === orderBy ? (orderDir === "ASC" ? " ↑" : " ↓") : ""}</th>`
      ).join("") + "</tr></thead><tbody>";
      for (const row of data.rows) {
        h += "<tr>" + columns.map(c => {
          let v = row[c];
          if (v === null || v === undefined) v = "";
          else if (typeof v === "object") v = JSON.stringify(v);
          const s = String(v);
          const long = s.length > 80 || c.includes("json") || c.includes("features") || c.includes("summary");
          return `<td class="${long ? "expand" : ""}" title="${s.replace(/"/g, "&quot;")}">${escapeHtml(s)}</td>`;
        }).join("") + "</tr>";
      }
      h += "</tbody></table>";
      document.getElementById("grid").innerHTML = h;
      document.querySelectorAll("th").forEach(th => {
        th.addEventListener("click", () => {
          const c = th.dataset.c;
          if (orderBy === c) orderDir = orderDir === "ASC" ? "DESC" : "ASC";
          else { orderBy = c; orderDir = "DESC"; }
          loadRows();
        });
      });
    }

    function escapeHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    document.getElementById("reload").onclick = loadRows;
    document.getElementById("prev").onclick = () => {
      const lim = Number(document.getElementById("limit").value) || 100;
      const off = Math.max(0, (Number(document.getElementById("offset").value) || 0) - lim);
      document.getElementById("offset").value = String(off);
      loadRows();
    };
    document.getElementById("next").onclick = () => {
      const lim = Number(document.getElementById("limit").value) || 100;
      const off = (Number(document.getElementById("offset").value) || 0) + lim;
      document.getElementById("offset").value = String(off);
      loadRows();
    };

    loadTables().catch(e => {
      document.getElementById("meta").textContent = String(e);
    });
  </script>
</body>
</html>
