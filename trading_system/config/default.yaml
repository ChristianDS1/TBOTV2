mode: paper  # paper | live — live requires explicit activation

capital:
  initial: 100.0
  currency: EUR
  base_trade_size: 10.0
  size_step_per_50_equity: 1.0

risk:
  max_simultaneous_positions: 5
  risk_per_trade_pct: 2.0
  soft_mode: true  # no daily-loss kill in paper
  max_correlated_exposure: 3
  stale_data_seconds: 120
  kill_on_api_failure: true

symbols:
  crypto:
    - BTC/USDT
    - ETH/USDT
  forex:
    - EUR/USD
    - GBP/USD

timeframes:
  primary: 1m
  lookback_bars: 200

strategy:
  name: bb_mean_reversion
  min_conditions: 3
  require_rejection_candle: true  # rejection_bull/bear hard gate (still counts toward 3/5)
  # Max retrace from extreme toward mid before entry is "too late" (fraction of band width)
  max_extreme_retrace_pct: 0.35
  # TP = early rejection move (NOT BB mid). Used for exits + fee edge check at entry.
  tp_mode: band_fraction
  tp_band_fraction: 0.25
  tp_min_bps: 12.0
  # Tight stop — cut losers before time_stop balloons the loss.
  # Limit is max NET loss (price move + exit fees); TP unchanged / not fee-shrunk.
  sl_band_fraction: 0.12
  sl_min_bps: 10.0
  sl_include_exit_fees: true
  bb_period: 20
  bb_std: 2.0
  rsi_period: 10
  rsi_oversold: 30
  rsi_overbought: 70
  macd_fast: [5, 8, 9]
  macd_slow: [13, 21, 9]
  # Hold window: early rejection is primary (preferred); bot may extend to max if still progressing
  min_hold_minutes: 1
  preferred_hold_minutes: 3
  max_hold_minutes: 10
  discovery_phase: true
  entry_confidence_floor: 0  # do not block in discovery

learning:
  phase: discovery  # discovery | pattern | optimization | exploitation
  exploration_budget: 0.25
  min_sample_size: 20
  pattern_min_occurrences: 20  # win AND loss — no confirm below this
  win_confidence_boost: 8.0     # only effect for confirmed win patterns
  loss_confidence_penalty: 15.0
  loss_soft_reject: true        # soft-reject entries matching confirmed loss keys
  # Keys starting with these NEVER soft-reject (too broad — would halt the whole strategy).
  # Rollback: set to [] to restore old behavior that rejected on strategy=...
  soft_reject_exclude_key_prefixes:
    - "strategy="
  # Session-aware learning: patterns confirm/apply per UTC time bucket (no cross-session bleed)
  session_aware: true
  session_buckets:
    - { name: asia, start_hour_utc: 0, end_hour_utc: 7 }
    - { name: europe, start_hour_utc: 7, end_hour_utc: 12 }
    - { name: us_open, start_hour_utc: 12, end_hour_utc: 16 }
    - { name: us_afternoon, start_hour_utc: 16, end_hour_utc: 21 }
    - { name: night, start_hour_utc: 21, end_hour_utc: 24 }
  retrain_every_n_trades: 50
  recency_half_life_trades: 100

capital_policy:
  auto_refill: true
  refill_to: 100.0  # top up when paper capital is exhausted

forex_session:
  # Approximate FX week in UTC — closed weekends
  open_weekday: 0  # Monday
  open_hour_utc: 0
  close_weekday: 4  # Friday
  close_hour_utc: 21
  close_intraday_at_session_end: true

execution:
  fee_bps: 4.0
  slippage_bps: 2.0
  poll_interval_seconds: 5
  # Paper leverage (margin model): margin=base_trade_size, notional=margin*leverage.
  # Fees/slippage charged on NOTIONAL (same bps at any leverage — matches perps).
  leverage: 20.0
  liquidation_margin_fraction: 0.9  # force-close if unrealized loss >= this * margin
  # Fee-aware edge (does NOT wipe learned patterns — forward-looking only)
  # Soft discovery defaults: only block near-hopeless edges; keep trade flow.
  hard_min_edge_multiple: 0.5   # discovery: was 0.75; rollback to 0.75 if too loose
  soft_min_edge_multiple: 1.15  # was 1.25
  soft_edge_confidence_penalty: 8.0
  # Hit BB mid but wait unless estimated NET PnL is strictly > 0 (not == 0)
  tp_require_positive_net: true

dashboard:
  host: 127.0.0.1
  port: 8000
  refresh_seconds: 5

database:
  path: data/trading.db

crypto:
  exchange: binance
  sandbox: false  # public OHLCV; paper fills are internal

forex:
  provider: yfinance  # pluggable OHLCV feed for paper
